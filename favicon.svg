<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Lloyd Sanderson monogram beneath a sakura canopy</title>
  <defs>
    <linearGradient id="background" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202832"/>
      <stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="canopy" x1="10" y1="7" x2="54" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8b8c8"/>
      <stop offset=".48" stop-color="#d88ea8"/>
      <stop offset="1" stop-color="#b85e82"/>
    </linearGradient>
    <linearGradient id="trunk" x1="42" y1="18" x2="57" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76505d"/>
      <stop offset="1" stop-color="#49343c"/>
    </linearGradient>
    <linearGradient id="monogram" x1="17" y1="20" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4edff"/>
      <stop offset=".42" stop-color="#83c3ff"/>
      <stop offset="1" stop-color="#4b9fe8"/>
    </linearGradient>
    <filter id="blue-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mark-frame">
      <rect x="5.5" y="5.5" width="53" height="53" rx="11.5"/>
    </clipPath>
    <g id="blossom">
      <ellipse cx="0" cy="-1.35" rx="1.05" ry="1.55" fill="#ead0d8"/>
      <ellipse cx="1.28" cy="-.42" rx="1.05" ry="1.55" fill="#deb4c2" transform="rotate(72 1.28 -.42)"/>
      <ellipse cx=".8" cy="1.1" rx="1.05" ry="1.55" fill="#ead0d8" transform="rotate(144 .8 1.1)"/>
      <ellipse cx="-.8" cy="1.1" rx="1.05" ry="1.55" fill="#deb4c2" transform="rotate(216 -.8 1.1)"/>
      <ellipse cx="-1.28" cy="-.42" rx="1.05" ry="1.55" fill="#ead0d8" transform="rotate(288 -1.28 -.42)"/>
      <circle r=".55" fill="#9d4f6c"/>
    </g>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#background)"/>

  <g clip-path="url(#mark-frame)">
    <g opacity=".08" stroke="#83c3ff" stroke-width="1">
      <path d="M13 32h38M13 42h38"/>
      <path d="M27 13v38M38 13v38"/>
    </g>

    <!-- A substantial right-side trunk stays separate from the monogram. -->
    <path d="M45.2 58.3c1.2-2.1 2.4-3.7 3.7-5.1 1.1-4.1.2-8.2-.2-12.6-.4-4.6.5-8.4-1.8-12.1l7-3.8c3.5 5.3 3.8 10.4 2.6 15.5-1.1 4.8-.7 9 2 12.8 1 1.7 1.6 3.5 1.8 5.3Z" fill="url(#trunk)"/>
    <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M51.8 30.4c-3.5-4.5-8-7.5-13.5-9.6-6.4-2.4-12.8-2.3-19.2-.4" stroke-width="3.4"/>
      <path d="M49.7 29.1c-4.4-4.4-7.1-9.2-7.6-15.1M52.1 29.5c.1-5.6 1.9-10.5 5.3-14.5" stroke-width="2.7"/>
      <path d="M40.8 21.7c-3.7-1.5-6.7-3.5-9-6.1M35.7 20c-4.2-.1-8 .8-11.5 2.7" stroke-width="1.55"/>
    </g>
    <path d="M52 55.8c.7-2.2.5-4.3.3-6.1.1-4.2 1.7-8.1 1-11.9" fill="none" stroke="#96707a" stroke-linecap="round" stroke-width="1.45" opacity=".7"/>
    <path d="M45.6 58.2c2.4-2 4.6-3 6.5-3.1 2 .1 4.5 1.2 7.5 3.1" fill="none" stroke="#3f2e34" stroke-linecap="round" stroke-width="1.2" opacity=".75"/>

    <!-- The monogram is deliberately geometric so it remains crisp at favicon size. -->
    <path d="M16 19h8v23.5h19V51H16Z" fill="#245f96" opacity=".7" transform="translate(1 1)"/>
    <path d="M16 19h8v23.5h19V51H16Z" fill="url(#monogram)" filter="url(#blue-glow)"/>
    <path d="M19.2 22.2h1.7v23.4h19v1.8H19.2Z" fill="#eef8ff" opacity=".48"/>

    <!-- Muted, uneven blossom masses keep the sakura character restrained. -->
    <path d="M6.8 18.7c-.7-4.3 2.6-7.8 7-7.4 1-4.2 6.8-6.1 10.3-3.1 3-4.4 10.4-5 14.2-.8 4.1-2.6 9.8-.8 11.3 3.5 4.8-.7 8.9 2.9 8.2 7.4 1.5 3.8-1.8 7.4-6.3 7.1-3.4 3.1-8.7 2.9-12-.1-4.4 3.2-10.8 3.1-14.5-.2-4.5 2.7-10.4 1.5-12.1-2.2-3.5.8-6.3-1.2-6.1-4.2Z" fill="#984964"/>
    <path d="M8.9 17.2c.1-3.2 3-5.2 6.1-4.4.5-3.5 4.9-5.5 8-3.2 1.4 3.8-.8 7.8-4.4 8.9-3.1 2.1-7.7 1.5-9.7-1.3Z" fill="#c87391"/>
    <path d="M18.8 12.2c1.1-4.6 6.3-6.5 9.8-3.6 2.4-4.1 8.6-4.4 11.5-.7 1.2 4.7-2.1 8.6-6.8 9.1-4.8 2.7-11.5.7-14.5-4.8Z" fill="url(#canopy)"/>
    <path d="M37.1 11.3c2.3-3.6 7.3-4.1 10.1-1 4-1.3 7.8 1.6 7.2 5.4 2.5 2.3 1.3 5.8-2.2 6.6-3.3 2.4-8.6.9-10-2.3-3.4-1-5.5-4.8-5.1-8.7Z" fill="#c36e8d"/>
    <path d="M16 18.2c2.6-3.3 7.4-3.7 10.1-.6 4.1-2.9 10.2-1.6 11.8 2.6.2 4-3.9 6.8-8 5.3-3.8 2.3-9.4.4-10.3-3.2-2.4.2-4.3-1.7-3.6-4.1Z" fill="#d89aae"/>
    <path d="M34.6 18.1c2.2-3.1 6.7-3.7 9.4-1.1 3.6-2.2 8.5-.1 8.8 3.8.4 3.3-3 5.8-6.4 4.5-3.3 2.8-9.2 1.3-10-2.5-2.1-.5-3.1-2.7-1.8-4.7Z" fill="#b65f80"/>
    <!-- A visible crown fork breaks through the blossoms like a mature tree limb. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52.2 31.2c.1-5.4 1.9-10.4 5.1-14.6" stroke="#543b43" stroke-width="3.35"/>
      <path d="M55.1 20.2c-.7-2.7-2.1-5-4.1-6.9M56.5 17.9c1-1.5 1.5-3.1 1.7-4.8" stroke="#5e424b" stroke-width="1.55"/>
      <path d="M53.4 28.8c.5-3.8 1.8-7.3 3.9-10.4" stroke="#95707a" stroke-width=".8" opacity=".7"/>
      <path d="M51.7 30.6c-4-1.8-8.1-2.7-12.3-2.8-3.5-.1-6.6.7-9.1 2.3" stroke="#543b43" stroke-width="2.25"/>
      <path d="M41.8 28c-1.9-1.8-3.1-3.6-3.6-5.5M35.4 28.5c-1.4-1.1-2.2-2.2-2.6-3.5" stroke="#5e424b" stroke-width="1.05"/>
      <path d="M49.8 30c-4.2-1.3-8.2-1.8-12.1-1.5" stroke="#95707a" stroke-width=".65" opacity=".65"/>
    </g>
    <g opacity=".86">
      <use href="#blossom" transform="translate(31 29.5) scale(.62) rotate(-12)"/>
      <use href="#blossom" transform="translate(38.6 25.1) scale(.58) rotate(11)"/>
      <use href="#blossom" transform="translate(43.9 28.5) scale(.5) rotate(-8)"/>
    </g>
    <g opacity=".72">
      <use href="#blossom" transform="translate(18.3 12.7) scale(.74)"/>
      <use href="#blossom" transform="translate(32.5 9.4) scale(.65) rotate(-12)"/>
      <use href="#blossom" transform="translate(47.2 14.4) scale(.65) rotate(8)"/>
    </g>

    <g>
      <path d="M10.3 30.2c2.8-1 4 1 1.6 3.6-2.5-.3-3.2-2.1-1.6-3.6Z" fill="#c87391"/>
      <path d="M43 31.4c2.5.6 2.7 2.8-.6 3.9-2-1.5-1.5-3.4.6-3.9Z" fill="#ad5878"/>
      <path d="M45.6 42.2c2.6-.4 3.6 1.6.7 3.6-2.4-.7-2.7-2.6-.7-3.6Z" fill="#c36e8d"/>
    </g>
  </g>

  <!-- The outline is drawn last so no internal artwork can visually cross it. -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#83c3ff" stroke-opacity=".48" stroke-width="3"/>
</svg>
